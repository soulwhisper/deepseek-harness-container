---
# CodeRabbit is an advisory reviewer. It never merges and never replaces the
# human review required for a preview upstream.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

tone_instructions: |
  Terse engineer register: facts, file:line evidence, risk, concrete fix.
  No compliments, no filler, no restating the diff.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    labels:
      # Renovate PRs never auto-merge; humans handle the coupled pin updates.
      - "!area/renovate"
    ignore_title_keywords:
      - "chore(deps)"
      - "fix(deps)"
      - "release(dsh-web)"
      - "release(dsh-tavern)"

  path_filters:
    - "!**/node_modules/**"
    - "!**/pnpm-lock.yaml"
    - "!docker/runtime/pnpm-lock.yaml"
    - "!docker/profiles/**/pnpm-lock.yaml"

  tools:
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: false

  path_instructions:
    - path: "patches/**"
      instructions: |
        Exact-hash patches against pinned upstream artifacts. Fail closed on an
        unknown hash or changed anchor. Never loosen a check, add a fallback, or
        apply a patch at runtime. Version, source commit and hash must agree with
        versions.json and the corresponding source archive.

    - path: "plugins/sso/**"
      instructions: |
        Mandatory trusted-proxy admission gate. Check the real TCP peer CIDR and
        exactly one allowlisted x-authentik-uid on every HTTP request and
        WebSocket upgrade. Never trust forwarded headers, add an OIDC flow,
        expose a token URL, or restore an unguarded listener. Missing/duplicate
        identity and untrusted peers must deny. SSO stays required and
        non-removable in the native manager.

    - path: "docker/**"
      instructions: |
        Runtime link targets are immutable and absolute. Profile locks are
        generated by the Docker profile-locks target and normalized; never
        hand-edit them. Keep the seed-relative versus $DSH_HOME link distinction
        intact. Dockerfile pins (Node digest, pnpm, Tavern commit, patch hashes)
        are coupled: a version-only bump is incomplete.

    - path: ".github/workflows/**"
      instructions: |
        PRs must not receive secrets, App tokens or package-write permission.
        Releases run from main pushes or release tags only. Keep actions pinned
        to a full commit SHA, permissions minimal, and support merge_group.
        Flag pull_request_target, unpinned actions, or a workflow that publishes
        from a feature branch.

    - path: "deploy/**"
      instructions: |
        Application-side examples only. No published host port, no default
        credentials or UIDs, no :latest, and no replacement for the verified
        edge. DSH_HOST must be a concrete Pod/container IP.

    - path: "versions.json"
      instructions: |
        DSH is a developer preview. A dsh.version or tavern.version change must
        update the source commit, release tag, patch hashes, locks and docs in
        the same PR. Map/image tags must keep the external release contract
        consistent. Human review is required even for a patch bump.

chat:
  auto_reply: true
