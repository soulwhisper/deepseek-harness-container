name: Validate final distribution images
description: Build both native amd64 targets with attestations, then smoke their exact digests
outputs:
  web-digest:
    description: Tested web OCI index digest
    value: ${{ steps.web.outputs.digest }}
  tavern-digest:
    description: Tested tavern OCI index digest
    value: ${{ steps.tavern.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24.22.0'
    - name: Install locked test dependencies
      shell: bash
      run: |
        set -euo pipefail
        npm install --global --ignore-scripts pnpm@11.25.0
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm exec playwright install --with-deps chromium
    - name: Validate source and behavioral tests
      shell: bash
      run: |
        set -euo pipefail
        node scripts/verify.mjs
        node --test test/*.test.mjs
    - name: Start loopback-only build registry
      shell: bash
      run: |
        set -euo pipefail
        docker run --detach --name dsh-build-registry \
          --publish 127.0.0.1:5000:5000 \
          registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      with:
        version: v0.29.1
        driver-opts: |
          network=host
          image=moby/buildkit:v0.25.1@sha256:79cc6476ab1a3371c9afd8b44e7c55610057c43e18d9b39b68e2b0c2475cc1b6
        buildkitd-config-inline: |
          [registry."localhost:5000"]
            http = true
    - name: Build web with provenance and SBOM
      id: web
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: docker/Dockerfile
        target: web
        build-args: IMAGE_REVISION=${{ github.sha }}
        platforms: linux/amd64
        push: true
        tags: localhost:5000/dsh-web:tested
        provenance: mode=max
        sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
        cache-from: type=gha,scope=web-amd64
        cache-to: type=gha,mode=max,scope=web-amd64
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
    - name: Build tavern with provenance and SBOM
      id: tavern
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: docker/Dockerfile
        target: tavern
        build-args: IMAGE_REVISION=${{ github.sha }}
        platforms: linux/amd64
        push: true
        tags: localhost:5000/dsh-tavern:tested
        provenance: mode=max
        sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
        cache-from: type=gha,scope=tavern-amd64
        cache-to: type=gha,mode=max,scope=tavern-amd64
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
    - name: Run exact final-image integration smoke
      shell: bash
      env:
        WEB_DIGEST: ${{ steps.web.outputs.digest }}
        TAVERN_DIGEST: ${{ steps.tavern.outputs.digest }}
      run: |
        set -euo pipefail
        docker pull "localhost:5000/dsh-web@${WEB_DIGEST}"
        docker pull "localhost:5000/dsh-tavern@${TAVERN_DIGEST}"
        node scripts/smoke.mjs "localhost:5000/dsh-web@${WEB_DIGEST}" "localhost:5000/dsh-tavern@${TAVERN_DIGEST}"
