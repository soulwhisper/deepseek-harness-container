name: Validate Pull Request

# PR-only change flow with explicit steps and a native amd64/arm64 matrix.
# No QEMU: each runner builds and smokes only its own architecture image.
# Public/fork PRs are not a supported submission path; their jobs are skipped.
#
# The workflow itself stays path-unfiltered so the required "CI checks passed"
# status always exists. The change detector skips only the expensive image
# matrix when no image/build input changed; static validation still runs.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect image inputs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect image-relevant files
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            echo 'images=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${BASE_SHA}"
          files="$(git diff --no-renames --name-only "${BASE_SHA}...HEAD")"
          # Only source/build inputs require the image matrix. Docs, tests,
          # deploy examples, scaffold scripts and non-critical dotfiles are
          # deliberately excluded; .dockerignore is the one dotfile exception
          # because it changes the build context itself.
          if grep -Eq '^(docker/|patches/|plugins/|versions\.json$|package\.json$|pnpm-lock\.yaml$|LICENSE$|NOTICE$|README\.md$|README\.zh-CN\.md$|docs/(source-build|regulations)\.md$|\.dockerignore$|\.github/workflows/ci\.yaml$|scripts/(entrypoint\.sh|materialize-state\.mjs|materialize-profiles\.mjs|floating-bundles\.mjs|normalize-locks\.mjs|finalize-profile\.mjs|readiness\.mjs|link-tavern-core\.mjs|seed-tavern-plugins\.mjs|seed-tavern-tools\.mjs)$)' <<< "$files"; then
            echo 'images=true' >> "$GITHUB_OUTPUT"
          else
            echo 'images=false' >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Static verify and tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'

      - name: Install locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate source and behavioral tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify.mjs
          node --test test/*.test.mjs

  images:
    name: Build and smoke ${{ matrix.target }} (${{ matrix.arch }})
    needs: [changes, static]
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: web, arch: amd64, runner: ubuntu-24.04 }
          - { target: web, arch: arm64, runner: ubuntu-24.04-arm }
          - { target: tavern, arch: amd64, runner: ubuntu-24.04 }
          - { target: tavern, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'

      - name: Install smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build native ${{ matrix.arch }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/${{ matrix.target }}.Dockerfile
          target: ${{ matrix.target }}
          build-args: IMAGE_REVISION=${{ github.sha }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: dsh-${{ matrix.target }}:smoke
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify native addon from the built image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --read-only --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=256m \
            --tmpfs /data:rw,nosuid,nodev,mode=1777,size=2g \
            --entrypoint node dsh-${{ matrix.target }}:smoke \
            --input-type=module - < scripts/verify-addon.mjs

      - name: Run final-image smoke (${{ matrix.arch }})
        shell: bash
        run: node scripts/smoke.mjs dsh-${{ matrix.target }}:smoke

  # Single required-status-check target for branch protection.
  ci-pass:
    name: CI checks passed
    needs: [changes, static, images]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Verify required validation succeeded
        shell: bash
        run: |
          set -euo pipefail
          for result in "${{ needs.changes.result }}" "${{ needs.static.result }}"; do
            if [ "${result}" != "success" ]; then
              echo "::error::Required job did not succeed: ${result}"
              exit 1
            fi
          done
          if [ "${{ needs.changes.outputs.images }}" = "true" ]; then
            if [ "${{ needs.images.result }}" != "success" ]; then
              echo "::error::Image validation was required but did not succeed: ${{ needs.images.result }}"
              exit 1
            fi
          elif [ "${{ needs.images.result }}" != "skipped" ]; then
            echo "::error::Image validation unexpectedly ran or failed: ${{ needs.images.result }}"
            exit 1
          fi
          echo "Validation passed"
