name: Validate Pull Request

# PR-only change flow with explicit steps and a native amd64/arm64 matrix.
# No QEMU: each runner builds and smokes only its own architecture image.
# Public/fork PRs are not a supported submission path; their jobs are skipped.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static verify and tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'

      - name: Install locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate source and behavioral tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify.mjs
          node --test test/*.test.mjs

  images:
    name: Build and smoke ${{ matrix.target }} (${{ matrix.arch }})
    needs: static
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: web, arch: amd64, runner: ubuntu-24.04 }
          - { target: web, arch: arm64, runner: ubuntu-24.04-arm }
          - { target: tavern, arch: amd64, runner: ubuntu-24.04 }
          - { target: tavern, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'

      - name: Install smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build native ${{ matrix.arch }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: IMAGE_REVISION=${{ github.sha }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: dsh-${{ matrix.target }}:smoke
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Run final-image smoke (${{ matrix.arch }})
        shell: bash
        run: node scripts/smoke.mjs dsh-${{ matrix.target }}:smoke

  label:
    name: Label PR areas
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: "${{ steps.app-token.outputs.token }}"
          configuration-path: .github/labeler.yaml

  # Single required-status-check target for branch protection.
  ci-pass:
    name: CI checks passed
    needs: [static, images]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Verify required validation succeeded
        shell: bash
        run: |
          set -euo pipefail
          for result in "${{ needs.static.result }}" "${{ needs.images.result }}"; do
            if [ "${result}" != "success" ]; then
              echo "::error::Validation did not succeed: ${result}"
              exit 1
            fi
          done
          echo "Validation passed"
