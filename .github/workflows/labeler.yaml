name: Labeler

# Separate from CI: build/test jobs must not receive App credentials. The
# labeler only applies reviewed area labels to same-repo PRs. Use the
# job-scoped default token so a pull_request workflow never receives the App
# private key; PR workflows must stay usable from untrusted branches.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Label PR areas
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yaml
