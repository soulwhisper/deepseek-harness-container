name: Prepare release

# Manual release preparation only. This workflow opens a draft PR with the
# collected history, CHANGELOG and Web version bump. It never tags, merges or
# publishes an image. A human reviews/fixes gaps, merges, then creates the
# web-* tag; the tag push runs publish.yaml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Web distribution version, for example 0.2.1-rc.3
        required: true
        type: string
      base_tag:
        description: Optional changelog base tag; defaults to the latest web-*/tavern-* tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: deepseek-harness-container
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'

      - name: Create draft release PR
        env:
          VERSION: ${{ inputs.version }}
          BASE_TAG: ${{ inputs.base_tag }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs
          branch="chore/prepare-release-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add versions.json package.json docker/runtime/package.json docker/Dockerfile \
            CHANGELOG.md README.md README.zh-CN.md docs/architecture.md docs/index.md
          git commit -m "chore(release): prepare ${VERSION}"
          git push -u origin "$branch"
          cat > /tmp/prepare-release-pr.md <<EOF
          ## Prepared release ${VERSION}

          This draft was generated by the **Prepare release** workflow. No tag,
          image or GitHub Release has been published.

          - Web tag: web-${VERSION}
          - Tavern tag: unchanged by this preparation
          - Base tag: ${BASE_TAG:-latest release tag}
          - Changelog: CHANGELOG.md (generated from history)
          - Updated: versions.json, package versions, Web image label, README/docs Web tags

          ## Human review

          - [ ] Review the generated changelog and add anything missing.
          - [ ] Complete README/docs release notes and tables if needed.
          - [ ] Confirm whether a separate Tavern release is required.
          - [ ] Fix any gaps and wait for required CI to pass.

          ## Publish

          After merge, create **web-${VERSION}** on the merge commit. The tag push
          triggers publish.yaml; that workflow builds and smokes native amd64/arm64
          before creating the multi-arch index.

          Do not publish from this workflow and do not merge this draft before review.
          EOF
          gh pr create --draft --base main --head "$branch" \
            --title "chore(release): prepare ${VERSION}" \
            --body-file /tmp/prepare-release-pr.md \
            --label review/required
