# Application-side example only. The verified edge performs OIDC/MFA,
# strips client identity headers and sets exactly one verified subject header.
# This file publishes no host port and does not configure the edge.
name: dsh

services:
  web:
    image: ${DSH_WEB_IMAGE:-ghcr.io/soulwhisper/dsh-web:0.2.2-alpha.2-r1}
    container_name: dsh-web
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=256m
    volumes:
      - dsh-web-data:/data
      - dsh-web-workspace:/workspace
      - dsh-web-cache:/cache
      - dsh-web-logs:/logs
      - dsh-web-backups:/backups
      # Optional reviewed profile patch (MCP servers, model endpoints, UI defaults):
      # - ./cordis.patch.mcp.example.yml:/data/dsh/cordis.patch.yml:ro
    environment:
      DSH_HOST: ${DSH_WEB_IP:-172.30.80.3}
      DSH_PORT: "3080"
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-}
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOST:-}
      DSH_FORWARD_AUTH_HEADER: ${DSH_FORWARD_AUTH_HEADER:-x-authentik-uid}
      DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: ${DSH_FORWARD_AUTH_ALLOWED_SUBJECTS:-}
      DSH_FORWARD_AUTH_TRUSTED_PROXY_CIDRS: ${DSH_FORWARD_AUTH_TRUSTED_PROXY_CIDRS:-}
      DSH_FORWARD_AUTH_MAX_CONNECTION_SECONDS: "${DSH_FORWARD_AUTH_MAX_CONNECTION_SECONDS:-900}"
    networks:
      dsh-private:
        ipv4_address: ${DSH_WEB_IP:-172.30.80.3}

  tavern:
    profiles: [tavern]
    image: ${DSH_TAVERN_IMAGE:-ghcr.io/soulwhisper/dsh-tavern:3.1.3}
    container_name: dsh-tavern
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=256m
    volumes:
      - dsh-tavern-data:/data
      - dsh-tavern-workspace:/workspace
      - dsh-tavern-cache:/cache
      - dsh-tavern-logs:/logs
      - dsh-tavern-backups:/backups
    environment:
      DSH_HOST: ${DSH_TAVERN_IP:-172.30.80.4}
      DSH_PORT: "3080"
      DSH_PUBLIC_URL: ${DSH_TAVERN_PUBLIC_URL:-}
      DSH_TRUSTED_HOSTS: ${DSH_TAVERN_TRUSTED_HOST:-}
      DSH_FORWARD_AUTH_HEADER: ${DSH_TAVERN_FORWARD_AUTH_HEADER:-x-authentik-uid}
      DSH_FORWARD_AUTH_ALLOWED_SUBJECTS: ${DSH_TAVERN_FORWARD_AUTH_ALLOWED_SUBJECTS:-}
      DSH_FORWARD_AUTH_TRUSTED_PROXY_CIDRS: ${DSH_TAVERN_FORWARD_AUTH_TRUSTED_PROXY_CIDRS:-}
      DSH_FORWARD_AUTH_MAX_CONNECTION_SECONDS: "${DSH_TAVERN_FORWARD_AUTH_MAX_CONNECTION_SECONDS:-900}"
    networks:
      dsh-private:
        ipv4_address: ${DSH_TAVERN_IP:-172.30.80.4}

networks:
  dsh-private:
    external: true

volumes:
  dsh-web-data:
  dsh-web-workspace:
  dsh-web-cache:
  dsh-web-logs:
  dsh-web-backups:
  dsh-tavern-data:
  dsh-tavern-workspace:
  dsh-tavern-cache:
  dsh-tavern-logs:
  dsh-tavern-backups:
