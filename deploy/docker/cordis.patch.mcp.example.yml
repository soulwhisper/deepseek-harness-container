# Mount this reviewed file read-only at /data/dsh/cordis.patch.yml.
# Replace every placeholder with a secret value supplied by your orchestrator;
# do not commit credentials. Ids must be unique and must not duplicate bundle
# inserts (for example, dsh-mnemon supplies id: mnemon).
# This example uses cluster-internal HTTP. Keep that hop on a trusted network or
# service mesh with encryption/mTLS; for an endpoint with TLS use https:// and
# the gateway's HTTPS port. Never expose these tokens to the public Internet.
- insert:
    - id: mcp-search
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: search
        transport: streamable-http
        url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/search
        headers:
          Authorization: "Bearer <mcp-search-token>"
        failOnStartupError: false
    - id: mcp-cluster
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cluster
        transport: streamable-http
        url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/cluster
        headers:
          Authorization: "Bearer <mcp-cluster-token>"
        failOnStartupError: false
    - id: mcp-home
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: home
        transport: streamable-http
        url: http://agentgateway-proxy.networking-system.svc.cluster.local:80/mcp/home
        headers:
          Authorization: "Bearer <mcp-home-token>"
        failOnStartupError: false
