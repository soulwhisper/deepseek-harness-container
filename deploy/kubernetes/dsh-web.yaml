# Application-side example, not a complete edge/IdP deployment.
# DSH binds the concrete Pod IP; the edge must reach port 3080 as the only peer.
apiVersion: v1
kind: Service
metadata:
  name: dsh-web
  namespace: dsh
  labels:
    app.kubernetes.io/name: dsh-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dsh-web
  ports:
    - name: http
      port: 3080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsh-web
  namespace: dsh
  labels:
    app.kubernetes.io/name: dsh-web
spec:
  serviceName: dsh-web
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsh-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsh-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dsh-web
          image: ghcr.io/soulwhisper/dsh-web:0.2.2-alpha.2-r1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3080
          env:
            - name: DSH_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DSH_PUBLIC_URL
              value: https://dsh.example.net
            - name: DSH_TRUSTED_HOSTS
              value: dsh.example.net
            - name: DSH_FORWARD_AUTH_HEADER
              value: x-authentik-uid
            - name: DSH_FORWARD_AUTH_ALLOWED_SUBJECTS
              valueFrom:
                secretKeyRef:
                  name: dsh-web-forward-auth
                  key: allowed-subjects
            - name: DSH_FORWARD_AUTH_TRUSTED_PROXY_CIDRS
              valueFrom:
                secretKeyRef:
                  name: dsh-web-forward-auth
                  key: trusted-proxy-cidrs
            - name: DSH_FORWARD_AUTH_MAX_CONNECTION_SECONDS
              value: "900"
            # Native skill roots are discovered automatically:
            #   /workspace/.dsh/skills, /workspace/.agents/skills,
            #   $DSH_HOME/skills and $DSH_AGENTS_HOME/skills.
            # Set DSH_SKILL_DIRS only for extra roots (for example /skills).
            # - name: DSH_SKILL_DIRS
            #   value: /skills
          startupProbe:
            exec:
              command: ["node", "/opt/dsh/scripts/readiness.mjs"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["node", "/opt/dsh/scripts/readiness.mjs"]
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: workspace
              mountPath: /workspace
            - name: cache
              mountPath: /cache
            - name: logs
              mountPath: /logs
            - name: backups
              mountPath: /backups
            - name: tmp
              mountPath: /tmp
      volumes:
        # Non-authoritative roots. Replace with PVCs only if you explicitly
        # need cache, logs or migration rollback copies to survive a restart.
        - name: cache
          emptyDir:
            sizeLimit: 4Gi
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
        - name: backups
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
