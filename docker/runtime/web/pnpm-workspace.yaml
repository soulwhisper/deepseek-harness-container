packages:
  - .
nodeLinker: hoisted
storeDir: /cache/pnpm/store
autoInstallPeers: true
confirmModulesPurge: false
# The Web runtime intentionally resolves alpha releases without a cooldown.
# This is an alpha-only exception; the published image digest is the boundary.
minimumReleaseAge: 0
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  koffi: true
  node-pty: true
  '@google/genai': false
  protobufjs: false
