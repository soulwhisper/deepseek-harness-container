---
site_name: DeepSeek Harness Container
site_url: https://soulwhisper.github.io/deepseek-harness-container/
repo_url: https://github.com/soulwhisper/deepseek-harness-container
repo_name: soulwhisper/deepseek-harness-container

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.tabs
    - navigation.top

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Understand:
      - Architecture: architecture.md
      - Operating constraints: constraints.md
      - Authentication: forward-auth.md
      - Host browser: browser.md
  - Build:
      - Build and release: build.md
      - Upstream patches: patches.md
  - Deploy:
      - Deployment: deploy.md
      - Operations: operations.md
      - State and backup: data-layout.md
  - Reference:
      - Licensing: regulations.md
      - Corresponding source: source-build.md
